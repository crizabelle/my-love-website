<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Love ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stars"></div>
    <div class="stars stars2"></div>

    <main class="love-card">

        <!-- HEART -->
        <div class="heart-container">
            <div class="heart">♥</div>
        </div>

        <!-- TITLE -->
        <h1>My love for you began...</h1>

        <!-- COUNTER -->
        <div class="counter">

            <div class="time-group">
                <div class="label">Days</div>
                <div class="numbers">
                    <span id="days1">0</span>
                    <span id="days2">0</span>
                    <span id="days3">0</span>
                </div>
            </div>

            <div class="time-group">
                <div class="label">Hours</div>
                <div class="numbers">
                    <span id="hours1">0</span>
                    <span id="hours2">0</span>
                </div>
            </div>

            <div class="time-group">
                <div class="label">Minutes</div>
                <div class="numbers">
                    <span id="minutes1">0</span>
                    <span id="minutes2">0</span>
                </div>
            </div>

            <div class="time-group">
                <div class="label">Seconds</div>
                <div class="numbers">
                    <span id="seconds1">0</span>
                    <span id="seconds2">0</span>
                </div>
            </div>

        </div>

        <!-- MESSAGE -->
        <p class="message">
            The harder you try to understand me,<br>
            the harder I fell into you<br>
            and every second means more. ❤️
        </p>

    </main>

    <!-- FLOATING HEARTS -->
    <div class="floating-hearts">
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
        <span>♡</span>
        <span>♥</span>
    </div>

    <script src="script.js"></script>

</body>
</html>
